# Windows kurulum dosyasini uretir. Yalnizca elle baslatilir: GitHub'da
# Actions sekmesinden "Run workflow" denildiginde calisir, her itmede degil.
name: Masaüstü kurulumu (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Bağımlılıkları yükle
        working-directory: desktop
        run: npm ci

      - name: Kurulum dosyalarını üret
        working-directory: desktop
        run: npm run build:win

      - name: Sonuçları yükle
        uses: actions/upload-artifact@v7
        with:
          name: capproje-windows
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
