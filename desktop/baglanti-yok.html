<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Bağlantı kurulamadı</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbfaf8;
        color: #20262c;
        font-family: system-ui, "Segoe UI", sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      main { max-width: 460px; text-align: center; }
      h1 { font-size: 21px; margin: 0 0 12px; }
      p { margin: 0 0 10px; line-height: 1.55; color: #4a5560; font-size: 14px; }
      ul { text-align: left; margin: 4px auto 20px; padding-left: 20px; color: #4a5560; font-size: 14px; line-height: 1.7; max-width: 340px; }
      code { background: #eeece7; border-radius: 4px; padding: 2px 6px; font-size: 13px; }
      a.retry {
        display: inline-block;
        margin-top: 6px;
        padding: 11px 26px;
        border-radius: 8px;
        background: #20262c;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
      }
      .detail { margin-top: 18px; font-size: 12px; color: #8a939c; }
    </style>
  </head>
  <body>
    <main>
      <h1>Capproje'ye bağlanılamadı</h1>
      <p>Program sunucuya ulaşamadı. Genellikle şu sebeplerden biridir:</p>
      <ul>
        <li>İnternet bağlantısı kopmuş olabilir.</li>
        <li>Sunucu bakımda ya da yeniden başlatılıyor olabilir.</li>
        <li>Şirket ağı bu adresi engelliyor olabilir.</li>
      </ul>
      <a class="retry" id="retry" href="#">Tekrar Dene</a>
      <p class="detail">Adres: <code id="address">—</code></p>
      <p class="detail" id="reason"></p>
    </main>
    <script>
      const parameters = new URLSearchParams(location.search);
      const address = parameters.get("url") || "";
      const reason = parameters.get("hata") || "";
      // Adres ve hata metni dışarıdan geliyor; sayfaya HTML olarak değil yalnızca
      // düz metin olarak yazılır.
      document.getElementById("address").textContent = address || "bilinmiyor";
      if (reason) document.getElementById("reason").textContent = "Teknik ayrıntı: " + reason;
      const retry = document.getElementById("retry");
      if (/^https?:\/\//i.test(address)) retry.href = address;
      else retry.remove();
    </script>
  </body>
</html>
